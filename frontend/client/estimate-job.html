<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink - Job Price Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen py-12">

    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 max-w-lg w-full space-y-6" 
         x-data="priceEstimator()" x-init="fetchSkills()">
        
        <div>
            <h2 class="text-2xl font-bold text-slate-900">Job Price Estimator</h2>
            <p class="text-xs text-slate-500 mt-1">Get an instant quote before booking a worker.</p>
        </div>

        <form @submit.prevent="getEstimate" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Select Service Skill</label>
                <select x-model="selectedSkillId" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white">
                    <option value="" disabled selected>-- Select a Trade --</option>
                    <template x-for="skill in skills" :key="skill.skill_id">
                        <option :value="skill.skill_id" x-text="skill.skill_name"></option>
                    </template>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Distance to Job Site (KM)</label>
                <input type="number" step="0.1" x-model="distanceKm" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="e.g. 5.5">
            </div>

            <div class="flex items-center justify-between p-3 border border-slate-200 rounded-lg bg-slate-50">
                <div>
                    <span class="text-sm font-medium text-slate-800 block">Emergency Dispatch</span>
                    <span class="text-xs text-slate-500">Adds 25% urgent service surcharge</span>
                </div>
                <input type="checkbox" x-model="isEmergency" class="w-5 h-5 text-indigo-600 rounded">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
                Calculate Estimate
            </button>
        </form>

        <template x-if="estimate">
            <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-lg space-y-2">
                <h3 class="text-sm font-semibold text-indigo-900 border-b border-indigo-200 pb-2">Price Breakdown</h3>
                <div class="flex justify-between text-xs text-indigo-700">
                    <span>Base Diagnostic Fee:</span>
                    <span class="font-medium" x-text="'₹' + estimate.base_fee"></span>
                </div>
                <div class="flex justify-between text-xs text-indigo-700">
                    <span>Travel Allowance (₹15/km):</span>
                    <span class="font-medium" x-text="'₹' + estimate.travel_fee"></span>
                </div>
                <div class="flex justify-between text-xs text-indigo-700" x-show="estimate.surcharge > 0">
                    <span>Emergency Surcharge (25%):</span>
                    <span class="font-medium text-red-600" x-text="'+₹' + estimate.surcharge"></span>
                </div>
                <div class="flex justify-between text-sm font-bold text-indigo-950 pt-2 border-t border-indigo-200">
                    <span>Total Estimated Amount:</span>
                    <span x-text="'₹' + estimate.total_amount"></span>
                </div>
            </div>
        </template>
    </div>

    <script type="module">
        import { supabase } from '../supabase-client.js';

        window.priceEstimator = function() {
            return {
                skills: [],
                selectedSkillId: '',
                distanceKm: 5.0,
                isEmergency: false,
                estimate: null,

                async fetchSkills() {
                    const { data, error } = await supabase.from('skills').select('skill_id, skill_name');
                    if (!error && data) {
                        this.skills = data;
                    }
                },

                async getEstimate() {
                    const { data, error } = await supabase.rpc('calculate_job_price_estimate', {
                        p_skill_id: this.selectedSkillId,
                        p_is_emergency: this.isEmergency,
                        p_distance_km: parseFloat(this.distanceKm)
                    });

                    if (error) {
                        alert('Error calculating price: ' + error.message);
                    } else if (data && data.length > 0) {
                        this.estimate = data[0];
                    }
                }
            }
        }
    </script>
</body>
</html>
