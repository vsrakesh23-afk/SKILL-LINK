<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink - Manage Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen py-12">

    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 max-w-lg w-full space-y-6" 
         x-data="portfolioManager()">
        <div>
            <h2 class="text-2xl font-bold text-slate-900">Upload Portfolio Item</h2>
            <p class="text-xs text-slate-500 mt-1">Showcase your completed trade work to build trust with clients.</p>
        </div>

        <form @submit.prevent="addPortfolioItem" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Worker ID</label>
                <input type="text" x-model="workerId" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="Paste your worker UUID">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Project Title</label>
                <input type="text" x-model="title" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="Complete Residential Rewiring">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Description</label>
                <textarea x-model="description" rows="2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="Upgraded old fuse box to modern MCB circuit breakers..."></textarea>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Media Image URL</label>
                <input type="url" x-model="mediaUrl" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="https://example.com/image.jpg">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
                Add to Portfolio
            </button>
        </form>
    </div>

    <script type="module">
        import { supabase } from '../supabase-client.js';

        window.portfolioManager = function() {
            return {
                workerId: '',
                title: '',
                description: '',
                mediaUrl: '',
                async addPortfolioItem() {
                    const { error } = await supabase
                        .from('worker_portfolios')
                        .insert([
                            {
                                worker_id: this.workerId,
                                title: this.title,
                                description: this.description,
                                media_url: this.mediaUrl
                            }
                        ]);

                    if (error) {
                        alert('Error adding portfolio: ' + error.message);
                    } else {
                        alert('Portfolio item added successfully!');
                        this.title = '';
                        this.description = '';
                        this.mediaUrl = '';
                    }
                }
            }
        }
    </script>
</body>
</html>
