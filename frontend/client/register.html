<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink - Client Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 max-w-md w-full space-y-6" 
         x-data="registrationForm()">
        <div>
            <h2 class="text-2xl font-bold text-slate-900">Create Client Account</h2>
            <p class="text-xs text-slate-500 mt-1">Register to start hiring verified local tradespeople.</p>
        </div>

        <form @submit.prevent="registerUser" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Full Name</label>
                <input type="text" x-model="fullName" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="Rahul Sharma">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Phone Number</label>
                <input type="tel" x-model="phone" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="+919876543210">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Email Address</label>
                <input type="email" x-model="email" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="rahul@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Home Address</label>
                <textarea x-model="address" required rows="2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="Enter your street address..."></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
                Register Account
            </button>
        </form>
    </div>

    <script type="module">
        import { supabase } from '../supabase-client.js';

        window.registrationForm = function() {
            return {
                fullName: '',
                phone: '',
                email: '',
                address: '',
                async registerUser() {
                    const { data, error } = await supabase
                        .from('users')
                        .insert([
                            { 
                                full_name: this.fullName, 
                                phone_number: this.phone, 
                                email: this.email, 
                                role: 'CLIENT', 
                                address: this.address 
                            }
                        ]);

                    if (error) {
                        alert('Error registering: ' + error.message);
                    } else {
                        alert('Registration successful! Account created in Supabase.');
                        this.fullName = '';
                        this.phone = '';
                        this.email = '';
                        this.address = '';
                    }
                }
            }
        }
    </script>
</body>
</html>
