<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink - Escrow & Dual-OTP Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen py-12">

    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 max-w-lg w-full space-y-6" 
         x-data="escrowVerificationManager()">
        <div>
            <h2 class="text-2xl font-bold text-slate-900">Dual-OTP Escrow Handshake</h2>
            <p class="text-xs text-slate-500 mt-1">Verify physical arrival and job completion to release funds securely[cite: 3].</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Active Job ID</label>
                <input type="text" x-model="jobId" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-mono" placeholder="Paste job UUID">
            </div>

            <!-- Phase 1: Start OTP -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                <h3 class="text-sm font-bold text-slate-800">Phase 1: Worker Arrival (Start OTP)[cite: 3]</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Enter 4-Digit Start OTP</label>
                    <input type="text" x-model="startOtp" maxlength="4" class="w-full border border-slate-300 rounded-lg p-2 text-sm tracking-widest text-center font-mono" placeholder="1234">
                </div>
                <button @click="verifyStart" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg text-xs transition">
                    Verify Arrival & Start Job
                </button>
            </div>

            <!-- Phase 2: Completion OTP & Settlement -->
            <div class="bg-emerald-50/50 p-4 rounded-lg border border-emerald-200 space-y-3">
                <h3 class="text-sm font-bold text-emerald-900">Phase 2: Inspection & Escrow Release[cite: 3]</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Enter 4-Digit Completion OTP</label>
                    <input type="text" x-model="completionOtp" maxlength="4" class="w-full border border-emerald-300 rounded-lg p-2 text-sm tracking-widest text-center font-mono" placeholder="5678">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Actual Hours Worked</label>
                    <input type="number" step="0.5" x-model="actualHours" class="w-full border border-emerald-300 rounded-lg p-2 text-sm" placeholder="2.0">
                </div>
                <button @click="verifyCompletion" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-xs transition shadow-sm">
                    Verify Completion & Release Escrow Funds[cite: 3]
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../../supabase-client.js';

        window.escrowVerificationManager = function() {
            return {
                jobId: '',
                startOtp: '',
                completionOtp: '',
                actualHours: 1.0,

                async verifyStart() {
                    if (!this.jobId || !this.startOtp) {
                        alert('Please provide Job ID and Start OTP.');
                        return;
                    }

                    const { data, error } = await supabase.rpc('verify_start_otp', {
                        p_job_id: this.jobId,
                        p_entered_otp: this.startOtp
                    });

                    if (error) {
                        alert('Error verifying start OTP: ' + error.message);
                    } else if (data === true) {
                        alert('Start OTP verified successfully! Job status updated to ARRIVED.');
                        this.startOtp = '';
                    } else {
                        alert('Invalid Start OTP. Please try again.');
                    }
                },

                async verifyCompletion() {
                    if (!this.jobId || !this.completionOtp) {
                        alert('Please provide Job ID and Completion OTP.');
                        return;
                    }

                    const { data, error } = await supabase.rpc('verify_completion_otp_and_settle', {
                        p_job_id: this.jobId,
                        p_entered_otp: this.completionOtp,
                        p_actual_hours: parseFloat(this.actualHours)
                    });

                    if (error) {
                        alert('Error settling escrow: ' + error.message);
                    } else if (data === true) {
                        alert('Completion OTP verified! Escrow released to worker wallet successfully[cite: 3].');
                        this.completionOtp = '';
                    } else {
                        alert('Invalid Completion OTP. Escrow remains locked.');
                    }
                }
            }
        }
    </script>
</body>
</html>
